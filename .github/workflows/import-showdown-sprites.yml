name: Audit expanded asset requirements

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inventory existing assets
        run: python3 tools/asset_inventory.py

      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: asset-audit
          path: assets/catalog/asset-audit.json
          if-no-files-found: error
